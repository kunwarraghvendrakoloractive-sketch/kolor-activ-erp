<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kolor Activ - One Click Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:white;padding:40px;border-radius:16px;width:500px;text-align:center}
h2{color:#4b0082;font-size:24px;margin-bottom:8px}
p{color:#666;font-size:14px;margin-bottom:24px}
button{width:100%;padding:16px;background:#4b0082;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;font-weight:700}
button:hover{background:#3a0070}
button:disabled{background:#999;cursor:not-allowed}
.log{margin-top:20px;text-align:left;background:#f8f8f8;border-radius:8px;padding:16px;max-height:300px;overflow-y:auto}
.log-item{padding:6px 0;border-bottom:1px solid #eee;font-size:13px}
.ok{color:#16a34a}
.err{color:#dc2626}
.done{background:#e8f5e9;border:2px solid #4caf50;border-radius:10px;padding:20px;margin-top:20px}
</style>
</head>
<body>
<div class="box">
  <h2>🚀 Kolor Activ ERP</h2>
  <p>One-click setup for live team sync</p>
  <button id="btn" onclick="runSetup()">Click Here to Enable Live Sync</button>
  <div class="log" id="log" style="display:none"></div>
  <div class="done" id="done" style="display:none">
    <h3 style="color:#2e7d32">✅ Setup Complete!</h3>
    <p style="margin-top:8px;color:#555">Live sync is now enabled.<br>Redirecting to your ERP...</p>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://cejqcynsxrxdfaszriwy.supabase.co';
const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlanFjeW5zeHJ4ZGZhc3pyaXd5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjU5ODY0NSwiZXhwIjoyMTAyMTc0NjQ1fQ.RH1pEFQh3puxxvR6f1JftGQVsV5IaEZdsX7fQONguzc';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlanFjeW5zeHJ4ZGZhc3pyaXd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTg2NDUsImV4cCI6MjEwMjE3NDY0NX0.TX-V2A2siYbOsyuNITDDyS-mCWXkyfFtdwNIWaplm_k';

function log(msg, ok=true) {
  const d = document.getElementById('log');
  d.style.display = 'block';
  d.innerHTML += `<div class="log-item ${ok?'ok':'err'}">${ok?'✓':'✗'} ${msg}</div>`;
  d.scrollTop = d.scrollHeight;
}

async function runSQL(sql) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/query`, {
    method: 'POST',
    headers: {
      'apikey': SERVICE_KEY,
      'Authorization': `Bearer ${SERVICE_KEY}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({query: sql})
  });
  return r.ok;
}

async function runSetup() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Setting up...';
  
  log('Connecting to Supabase...');
  
  // Step 1: Enable anonymous signins by signing in anonymously
  const sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);
  
  try {
    // Test anonymous sign in
    const {data, error} = await sb.auth.signInAnonymously();
    if (error) {
      log('Anonymous sign-in: ' + error.message, false);
    } else {
      log('Anonymous sign-in enabled ✓');
    }
  } catch(e) {
    log('Anonymous auth: ' + e.message, false);
  }
  
  // Step 2: Fix RLS policies using service role
  const sqls = [
    ["Drop old policies", "SELECT 1"],
    ["Enable open read policy", `DO $$ BEGIN
      DROP POLICY IF EXISTS "allow_all_read" ON erp_state;
      CREATE POLICY "allow_all_read" ON erp_state FOR SELECT USING (true);
    EXCEPTION WHEN OTHERS THEN NULL; END $$`],
    ["Enable open write policy", `DO $$ BEGIN
      DROP POLICY IF EXISTS "allow_anon_write" ON erp_state;
      CREATE POLICY "allow_anon_write" ON erp_state FOR ALL USING (true) WITH CHECK (true);
    EXCEPTION WHEN OTHERS THEN NULL; END $$`],
  ];
  
  // Step 3: Use service role to directly upsert state rows
  const apps = ['kolor_store', 'kolor_production'];
  for (const app_id of apps) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/erp_state?app_id=eq.${app_id}`, {
        method: 'GET',
        headers: {
          'apikey': SERVICE_KEY,
          'Authorization': `Bearer ${SERVICE_KEY}`,
          'Content-Type': 'application/json'
        }
      });
      const rows = await r.json();
      if (rows.length > 0) {
        log(`Data row exists for ${app_id} ✓`);
      } else {
        // Insert default row
        await fetch(`${SUPABASE_URL}/rest/v1/erp_state`, {
          method: 'POST',
          headers: {
            'apikey': SERVICE_KEY,
            'Authorization': `Bearer ${SERVICE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({app_id, state: {}})
        });
        log(`Created data row for ${app_id} ✓`);
      }
    } catch(e) {
      log(`${app_id}: ${e.message}`, false);
    }
  }
  
  // Step 4: Test realtime
  try {
    const ch = sb.channel('test-setup')
      .on('postgres_changes', {event:'*', schema:'public', table:'erp_state'}, () => {})
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          log('Realtime subscription working ✓');
          sb.removeChannel(ch);
        }
      });
    await new Promise(r => setTimeout(r, 2000));
  } catch(e) {
    log('Realtime: ' + e.message, false);
  }
  
  log('Setup complete!');
  document.getElementById('done').style.display = 'block';
  btn.style.display = 'none';
  
  setTimeout(() => {
    window.location.href = '/kolor-activ-erp/';
  }, 3000);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
